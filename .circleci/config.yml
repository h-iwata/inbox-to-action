version: 2.1

executors:
  default:
    docker:
      # Node は mise.toml で固定するため、ベースイメージには含めない
      - image: cimg/base:current
    working_directory: ~/repo

commands:
  setup-mise:
    description: "Install mise and provision the toolchain defined in mise.toml"
    steps:
      - restore_cache:
          keys:
            - v1-mise-{{ checksum "mise.toml" }}
            - v1-mise-
      - run:
          name: Install mise
          command: |
            if [ ! -x "$HOME/.local/bin/mise" ]; then
              curl -fsSL https://mise.run | sh
            fi
            echo 'export PATH="$HOME/.local/share/mise/shims:$HOME/.local/bin:$PATH"' >> "$BASH_ENV"
      - run:
          name: Install toolchain
          command: |
            mise trust
            mise install
      - save_cache:
          paths:
            - ~/.local/bin
            - ~/.local/share/mise
          key: v1-mise-{{ checksum "mise.toml" }}
      - run:
          name: Verify toolchain
          command: |
            node --version
            npm --version

  restore-node-modules:
    description: "Restore node_modules cache"
    steps:
      - restore_cache:
          keys:
            - v1-dependencies-{{ checksum "package-lock.json" }}
            - v1-dependencies-

  save-node-modules:
    description: "Save node_modules cache"
    steps:
      - save_cache:
          paths:
            - node_modules
          key: v1-dependencies-{{ checksum "package-lock.json" }}

  install-deps:
    description: "Set up the toolchain and install dependencies"
    steps:
      - checkout
      - setup-mise
      - restore-node-modules
      - run:
          name: Install dependencies
          command: npm ci
      - save-node-modules

jobs:
  test:
    executor: default
    steps:
      - install-deps
      - run:
          name: Run type check
          command: npm run typecheck
      - run:
          name: Run linter
          command: npm run lint:strict
      - run:
          name: Check code formatting
          command: npm run format:check
      - run:
          name: Run tests
          command: npm run test
      - run:
          name: Build application
          command: npm run build
      - persist_to_workspace:
          root: .
          paths:
            - dist

  security-scan:
    executor: default
    steps:
      - install-deps
      - run:
          name: Run npm audit
          command: |
            npm audit --audit-level=moderate || true
            echo "Security scan complete. Check above for any vulnerabilities."
      - run:
          name: Check for outdated dependencies
          command: |
            npm outdated || true
            echo "Dependency check complete."

workflows:
  version: 2
  test-and-build:
    jobs:
      - test
      - security-scan:
          filters:
            branches:
              only:
                - main

  nightly-security-check:
    triggers:
      - schedule:
          cron: "0 2 * * *"  # 毎日午前2時（UTC）に実行
          filters:
            branches:
              only:
                - main
    jobs:
      - security-scan
